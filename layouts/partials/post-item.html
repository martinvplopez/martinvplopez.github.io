<li class="post-item">
    <a class="post-link" href="{{ .RelPermalink }}">
        <h2 class="post-item-title">{{ .Title }}</h2>
        {{ with .Description }}
        <p class="post-item-desc">{{ . }}</p>
        {{ else }}{{ if .IsPage }}
        <p class="post-item-desc">{{ .Summary | plainify | truncate 180 }}</p>
        {{ end }}{{ end }}
        {{ if .IsPage }}
        <p class="meta">{{ partial "post-meta.html" . }}</p>
        {{ end }}
    </a>
</li>
