<footer class="site-footer">
    <div class="wrap">
        <div class="footer-inner">
            <span>&copy; {{ now.Year }} {{ site.Params.author }}</span>
            <span class="links">
                {{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
                {{ with site.Params.twitter }}<a href="https://x.com/{{ . }}" target="_blank" rel="noopener">X</a>{{ end }}
                {{ with site.Params.linkedin }}<a href="https://www.linkedin.com/in/{{ . }}" target="_blank" rel="noopener">LinkedIn</a>{{ end }}
            </span>
        </div>
    </div>
</footer>
