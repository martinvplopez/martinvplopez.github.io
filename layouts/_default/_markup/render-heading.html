{{- /* Shift Markdown headings down one level: the post title is the page's only h1, so `#` renders as h2. */ -}}
{{- $level := cond (lt .Level 6) (add .Level 1) 6 -}}
<h{{ $level }} id="{{ .Anchor }}"><a class="anchor" href="#{{ .Anchor }}" aria-hidden="true" tabindex="-1">#</a>{{ .Text }}</h{{ $level }}>
{{- /* chomp trailing newline */ -}}
