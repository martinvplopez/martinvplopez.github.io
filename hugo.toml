baseURL = 'https://martinvplopez.com/'
languageCode = 'en-us'
title = 'Martín vPL'

[pagination]
  pagerSize = 5

[params]
  description = "A space to slow down, gather scattered thoughts, and trace how my truth, interests, and vision change over time."
  author = "Martín van Puffelen López"
  authorDescription = "martinvplopez@gmail.com"
  twitter = "martinvplopez"
  linkedin = "martinvplopez"
  
# Header links come from this menu. To add an About page, create
# content/about.md and uncomment:
# [[menu.main]]
#   name = "About"
#   pageRef = "/about"
#   weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      # Lets the image render hook turn standalone images into <figure>s
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github-dark'
